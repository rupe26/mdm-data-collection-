<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PM Poshan Data Update - Ambajogai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 pb-10">

    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 mt-2 sm:mt-6">
        
        <!-- Header & Admin Login -->
        <div class="flex justify-between items-center mb-4">
            <div class="text-xs sm:text-sm font-semibold text-gray-600 bg-blue-100 text-blue-800 px-3 py-1 rounded-full">
                📊 Block: Ambajogai (अंबाजोगाई)
            </div>
            <button id="adminLoginBtn" class="text-sm text-gray-600 hover:text-blue-600 transition-colors flex items-center gap-1 bg-white px-3 py-1.5 rounded-lg shadow-sm border border-gray-200">
                ⚙️ Admin Dashboard
            </button>
        </div>

        <!-- Real-time Dashboard Summary Cards -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs text-gray-500 font-medium">Total Schools</p>
                <h3 id="totalCount" class="text-lg sm:text-2xl font-bold text-gray-800">0</h3>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-green-100 text-center bg-green-50/40">
                <p class="text-xs text-green-600 font-medium">Updated / Locked</p>
                <h3 id="updatedCount" class="text-lg sm:text-2xl font-bold text-green-700">0</h3>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-orange-100 text-center bg-orange-50/40">
                <p class="text-xs text-orange-600 font-medium">Remaining</p>
                <h3 id="pendingCount" class="text-lg sm:text-2xl font-bold text-orange-700">0</h3>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden relative border border-gray-100">
            <div class="bg-blue-600 px-5 py-4 sm:px-6">
                <h1 class="text-lg sm:text-xl font-bold text-white leading-tight">PM Poshan Data Collection Portal</h1>
                <p class="text-blue-100 text-xs sm:text-sm mt-0.5">Search your UDISE code to verify or update information</p>
            </div>

            <div class="p-5 sm:p-6">
                <!-- Search Section -->
                <div class="mb-6" id="searchSection">
                    <label for="udiseSearch" class="block text-sm font-semibold text-gray-700 mb-2">Enter UDISE Number (यु-डायस क्रमांक)</label>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="tel" id="udiseSearch" class="flex-1 border border-gray-300 rounded-lg px-4 py-3 sm:py-2 focus:ring-2 focus:ring-blue-500 outline-none text-base" placeholder="e.g., 27270100201">
                        <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 sm:py-2 rounded-lg font-medium transition-colors shadow-sm w-full sm:w-auto">Search</button>
                    </div>
                    <p id="searchMessage" class="text-sm mt-2 hidden"></p>
                </div>

                <!-- Admin Dashboard (Hidden by default) -->
                <div id="adminDashboard" class="hidden mb-6 bg-gray-50 p-4 sm:p-5 rounded-lg border border-gray-200 shadow-inner">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800">Admin Control Panel</h2>
                        <button id="closeAdminBtn" class="text-gray-400 hover:text-red-500 font-bold p-2 text-xl leading-none">&times;</button>
                    </div>
                    
                    <div class="space-y-4">
                        <!-- Filter Options for Excel Download -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Filter Export Data by Status</label>
                                <select id="excelFilterStatus" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white text-sm">
                                    <option value="all">All Schools</option>
                                    <option value="locked">Updated / Locked Only</option>
                                    <option value="pending">Remaining / Pending Only</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Sort Export Order</label>
                                <select id="excelSortOrder" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white text-sm">
                                    <option value="udise_asc">UDISE Code (Ascending)</option>
                                    <option value="udise_desc">UDISE Code (Descending)</option>
                                    <option value="name_asc">School Name (A to Z)</option>
                                </select>
                            </div>
                        </div>

                        <button id="downloadExcelBtn" class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded-lg font-medium transition-colors shadow-sm flex items-center justify-center gap-2">
                            📥 Download Filtered Excel Report
                        </button>

                        <div class="border-t border-gray-300 pt-4">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Unlock/Reset Specific School Data</label>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <input type="tel" id="adminUdiseReset" class="flex-1 border border-gray-300 rounded-lg px-4 py-3 sm:py-2 text-base bg-white" placeholder="Enter UDISE to unlock">
                                <button id="resetUdiseBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white px-6 py-3 sm:py-2 rounded-lg font-medium shadow-sm w-full sm:w-auto">Unlock</button>
                            </div>
                            <p id="adminMessage" class="text-sm mt-2 hidden"></p>
                        </div>
                    </div>
                </div>

                <hr class="border-gray-200 mb-6 hidden" id="divider">

                <!-- Data Form Section -->
                <form id="dataForm" class="hidden space-y-6">
                    <input type="hidden" id="recordKey">
                    
                    <div id="lockedBadge" class="hidden bg-yellow-50 text-yellow-800 text-sm font-medium px-4 py-2 rounded-md border border-yellow-200 flex items-center gap-2 mb-2">
                        <span>🔒</span> Data Submitted & Locked
                    </div>

                    <!-- Location & Basic Details -->
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-4">
                        <h3 class="text-md font-bold text-gray-800 border-b pb-2">School & Location Details</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">School Name</label>
                                <input type="text" id="school_name" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">UDISE Code</label>
                                <input type="text" id="udise_code" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Block</label>
                                <input type="text" id="block" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Cluster</label>
                                <input type="text" id="cluster" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Cluster Code</label>
                                <input type="text" id="cluster_code" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                        </div>
                    </div>

                    <!-- Headmaster & Enrollment -->
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-4">
                        <h3 class="text-md font-bold text-gray-800 border-b pb-2">Headmaster & Enrollment</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Headmaster Name</label>
                                <input type="text" id="headmaster_name" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Headmaster Mobile</label>
                                <input type="tel" id="headmaster_mobile" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Enrollment (1 to 5)</label>
                                <input type="number" id="enrollment_1_5" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Enrollment (6 to 8)</label>
                                <input type="number" id="enrollment_6_8" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                        </div>
                    </div>

                    <!-- Banking & PFMS -->
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-4">
                        <h3 class="text-md font-bold text-gray-800 border-b pb-2">Banking & PFMS Details</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Account Name</label>
                                <input type="text" id="account_name" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Bank Name</label>
                                <input type="text" id="bank_name" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Account Number</label>
                                <input type="text" id="account_no" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">IFSC Code</label>
                                <input type="text" id="ifsc" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">PFMS Vendor Code</label>
                                <input type="text" id="pfms_vendor_code" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">TAN</label>
                                <input type="text" id="tan" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">PAN (Optional)</label>
                                <input type="text" id="pan" class="w-full border border-gray-300 rounded-lg px-3 py-2 form-input bg-white uppercase" placeholder="Enter if available">
                            </div>
                        </div>
                    </div>

                    <div class="pt-4" id="submitContainer">
                        <button type="submit" id="updateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-4 rounded-lg font-bold text-lg transition-colors shadow-md active:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300">
                            Submit & Lock All Data
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase Logic & Dashboard Script -->
    <script>
        const firebaseConfig = {
            databaseURL: "https://mdm-ambajogai-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dbRef = db.ref();

        const ADMIN_PIN = "2026"; 

        // UI Elements
        const searchBtn = document.getElementById('searchBtn');
        const udiseSearch = document.getElementById('udiseSearch');
        const searchMessage = document.getElementById('searchMessage');
        const divider = document.getElementById('divider');
        const dataForm = document.getElementById('dataForm');
        const formInputs = document.querySelectorAll('.form-input');
        const submitContainer = document.getElementById('submitContainer');
        const lockedBadge = document.getElementById('lockedBadge');
        const updateBtn = document.getElementById('updateBtn');
        const recordKeyField = document.getElementById('recordKey');

        // Counters
        const totalCountEl = document.getElementById('totalCount');
        const updatedCountEl = document.getElementById('updatedCount');
        const pendingCountEl = document.getElementById('pendingCount');

        // Fields (excluding udise_code_marathi and sr_no)
        const fields = [
            'school_name', 'udise_code', 'block', 'cluster', 
            'cluster_code', 'headmaster_name', 'headmaster_mobile', 
            'enrollment_1_5', 'enrollment_6_8', 'account_name', 'bank_name', 
            'account_no', 'ifsc', 'pfms_vendor_code', 'tan', 'pan'
        ];

        const fieldElements = {};
        fields.forEach(f => fieldElements[f] = document.getElementById(f));

        // Admin UI Elements
        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const adminDashboard = document.getElementById('adminDashboard');
        const closeAdminBtn = document.getElementById('closeAdminBtn');
        const downloadExcelBtn = document.getElementById('downloadExcelBtn');
        const resetUdiseBtn = document.getElementById('resetUdiseBtn');
        const adminUdiseReset = document.getElementById('adminUdiseReset');
        const adminMessage = document.getElementById('adminMessage');
        const excelFilterStatus = document.getElementById('excelFilterStatus');
        const excelSortOrder = document.getElementById('excelSortOrder');

        // Real-time Dashboard Listener
        dbRef.on('value', (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                let total = 0;
                let updated = 0;

                Object.values(data).forEach(record => {
                    total++;
                    if (record.locked === 1) {
                        updated++;
                    }
                });

                totalCountEl.textContent = total;
                updatedCountEl.textContent = updated;
                pendingCountEl.textContent = total - updated;
            } else {
                totalCountEl.textContent = 0;
                updatedCountEl.textContent = 0;
                pendingCountEl.textContent = 0;
            }
        });

        // 1. Search Database
        searchBtn.addEventListener('click', async () => {
            const searchValue = udiseSearch.value.trim();
            if (!searchValue) return;

            searchBtn.textContent = 'Searching...';
            searchMessage.classList.add('hidden');
            dataForm.classList.add('hidden');
            divider.classList.add('hidden');

            try {
                const snapshot = await dbRef.child(searchValue).get();

                if (snapshot.exists()) {
                    const record = snapshot.val();
                    recordKeyField.value = searchValue; 
                    
                    fields.forEach(f => {
                        if(fieldElements[f]) {
                            fieldElements[f].value = record[f] !== undefined ? record[f] : '';
                        }
                    });
                    
                    if (record.locked === 1) {
                        formInputs.forEach(input => {
                            input.readOnly = true;
                            input.classList.add('bg-gray-100', 'text-gray-500', 'border-gray-200');
                        });
                        submitContainer.classList.add('hidden');
                        lockedBadge.classList.remove('hidden');
                    } else {
                        formInputs.forEach(input => {
                            input.readOnly = false;
                            input.classList.remove('bg-gray-100', 'text-gray-500', 'border-gray-200');
                        });
                        submitContainer.classList.remove('hidden');
                        lockedBadge.classList.add('hidden');
                    }
                    
                    divider.classList.remove('hidden');
                    dataForm.classList.remove('hidden');
                    dataForm.scrollIntoView({ behavior: 'smooth', block: 'start' });

                } else {
                    showMessage(searchMessage, 'UDISE number not found.', 'text-red-600');
                }
            } catch (error) {
                console.error(error);
                showMessage(searchMessage, 'Connection Error: Check rules or network.', 'text-red-600');
            } finally {
                searchBtn.textContent = 'Search';
            }
        });

        // 2. Update and Lock
        dataForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = recordKeyField.value;
            
            updateBtn.textContent = 'Saving...';
            updateBtn.disabled = true;

            const updates = {};
            fields.forEach(f => {
                if(fieldElements[f]) {
                    updates['/' + key + '/' + f] = fieldElements[f].value.trim();
                }
            });
            updates['/' + key + '/locked'] = 1;

            try {
                await dbRef.update(updates);
                showMessage(searchMessage, 'All data submitted and locked successfully!', 'text-green-600');
                dataForm.classList.add('hidden');
                divider.classList.add('hidden');
                udiseSearch.value = '';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                showMessage(searchMessage, 'Failed to save data.', 'text-red-600');
            } finally {
                updateBtn.textContent = 'Submit & Lock All Data';
                updateBtn.disabled = false;
            }
        });

        // 3. Admin Dashboard
        adminLoginBtn.addEventListener('click', () => {
            if (adminDashboard.classList.contains('hidden')) {
                const pin = prompt("Enter Admin PIN:");
                if (pin === ADMIN_PIN) {
                    adminDashboard.classList.remove('hidden');
                    adminDashboard.scrollIntoView({ behavior: 'smooth' });
                } else if (pin !== null) {
                    alert("Incorrect PIN");
                }
            }
        });

        closeAdminBtn.addEventListener('click', () => {
            adminDashboard.classList.add('hidden');
            adminMessage.classList.add('hidden');
        });

        // 4. Filtered & Sorted Excel Download
        downloadExcelBtn.addEventListener('click', async () => {
            downloadExcelBtn.textContent = "Generating...";
            try {
                const snapshot = await dbRef.get();
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    let exportList = [];

                    for (const [udise, record] of Object.entries(data)) {
                        const isLocked = record.locked === 1;
                        const statusFilter = excelFilterStatus.value;

                        // Apply Status Filter
                        if (statusFilter === 'locked' && !isLocked) continue;
                        if (statusFilter === 'pending' && isLocked) continue;

                        exportList.push({
                            "BLOCK": record.block || "",
                            "CLUSTER": record.cluster || "",
                            "CLUSTER CODE": record.cluster_code || "",
                            "UDISE CODE": record.udise_code || udise,
                            "SCHOOL NAME": record.school_name || "",
                            "HM NAME": record.headmaster_name || "",
                            "HM MOBILE": record.headmaster_mobile || "",
                            "ENROLL 1-5": record.enrollment_1_5 || "",
                            "ENROLL 6-8": record.enrollment_6_8 || "",
                            "ACCOUNT NAME": record.account_name || "",
                            "BANK NAME": record.bank_name || "",
                            "ACCOUNT NO": record.account_no || "",
                            "IFSC": record.ifsc || "",
                            "PFMS VENDOR": record.pfms_vendor_code || "",
                            "TAN": record.tan || "",
                            "PAN": record.pan || "",
                            "STATUS": isLocked ? "Locked" : "Pending"
                        });
                    }

                    // Apply Sorting
                    const sortOrder = excelSortOrder.value;
                    exportList.sort((a, b) => {
                        if (sortOrder === 'udise_asc') {
                            return a["UDISE CODE"].localeCompare(b["UDISE CODE"]);
                        } else if (sortOrder === 'udise_desc') {
                            return b["UDISE CODE"].localeCompare(a["UDISE CODE"]);
                        } else if (sortOrder === 'name_asc') {
                            return a["SCHOOL NAME"].localeCompare(b["SCHOOL NAME"]);
                        }
                        return 0;
                    });

                    const ws = XLSX.utils.json_to_sheet(exportList);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "PM_Poshan_Report");
                    XLSX.writeFile(wb, "PM_POSHAN_Filtered_Report.xlsx");
                }
            } catch (error) {
                console.error(error);
                alert("Error generating Excel file.");
            } finally {
                downloadExcelBtn.innerHTML = "📥 Download Filtered Excel Report";
            }
        });

        // 5. Admin Reset Lock
        resetUdiseBtn.addEventListener('click', async () => {
            const udiseToReset = adminUdiseReset.value.trim();
            if (!udiseToReset) return;

            resetUdiseBtn.textContent = "Wait...";
            try {
                const snapshot = await dbRef.child(udiseToReset).get();
                if (snapshot.exists()) {
                    await dbRef.update({ ['/' + udiseToReset + '/locked']: 0 });
                    showMessage(adminMessage, `UDISE ${udiseToReset} is now unlocked!`, 'text-green-600');
                    adminUdiseReset.value = '';
                } else {
                    showMessage(adminMessage, 'UDISE not found.', 'text-red-600');
                }
            } catch (error) {
                showMessage(adminMessage, 'Error resetting record.', 'text-red-600');
            } finally {
                resetUdiseBtn.textContent = "Unlock";
            }
        });

        function showMessage(element, text, colorClass) {
            element.textContent = text;
            element.className = `text-sm mt-2 block font-medium ${colorClass}`;
            element.classList.remove('hidden');
        }
    </script>
</body>
</html>
